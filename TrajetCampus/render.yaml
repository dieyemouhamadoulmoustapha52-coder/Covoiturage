services:
  - type: web
    name: trajetcampus-backend
    env: python
    region: frankfurt # ou une autre région de ton choix (ex: oregon, ohio)
    plan: free
    rootDir: TrajetCampus/backend
    buildCommand: pip install -r requirements.txt && python manage.py migrate
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11
      - key: DEBUG
        value: false
      - key: ALLOWED_HOSTS
        value: trajetcampus.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://covoiturage-isep.netlify.app
      - key: SECRET_KEY
        generateValue: true # Render peut générer une clé secrète automatiquement
